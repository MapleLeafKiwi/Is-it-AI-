<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a1d">
<title>LED in Action Christmas Dinner · Real or AI?</title>
<style>
  :root{
    --bg:#0f2a1d; --card:#163a29; --line:#24543c; --text:#f4f1e8; --muted:#a9c2b2;
    --red:#d6453d; --red2:#b8352e; --gold:#f2c14e; --green:#3fae6a; --blue:#4c8fd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{max-width:640px;margin:0 auto;padding:12px 14px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
  header h1{font-size:20px;margin:0;letter-spacing:.3px}
  header h1 span{color:var(--gold)}
  .pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:#bff0cf;border-color:#2f7a4e}
  .pill.warn{color:#ffe0a6;border-color:#8a6a24}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .big{font-size:28px;font-weight:800;margin:4px 0}
  .huge{font-size:40px;font-weight:900;margin:6px 0;letter-spacing:.5px}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  button{font:inherit;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;
    color:#fff;background:var(--red);cursor:pointer;width:100%;touch-action:manipulation}
  button:active{transform:scale(.98)}
  button.secondary{background:#2a5a41}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;padding:10px}
  button:disabled{opacity:.45}
  .vote{padding:26px 10px;font-size:22px;border:3px solid transparent}
  .vote.ai{background:var(--blue)}
  .vote.real{background:var(--green)}
  .vote.chosen{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.25)}
  .vote.dim{opacity:.4}
  input{font:inherit;font-size:20px;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:#0c2218;color:var(--text);margin:8px 0 12px}
  .media-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;margin:12px 0;
    min-height:120px;display:flex;align-items:center;justify-content:center}
  .media{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}
  .sound{position:absolute;right:10px;bottom:10px;width:auto;padding:8px 12px;font-size:14px;
    background:rgba(0,0,0,.6);border-radius:99px}
  .result{border-radius:16px;padding:16px;text-align:center;margin:12px 0}
  .result.ai{background:var(--blue)}
  .result.real{background:var(--green)}
  .qr{background:#fff;border-radius:14px;padding:10px;width:min(320px,80vw);margin:8px auto;display:block}
  .url{word-break:break-all;font-size:13px;color:var(--muted)}
  ol.board{list-style:none;padding:0;margin:0;counter-reset:r}
  ol.board li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:6px 0;background:#0f2e20}
  ol.board li .pos{width:30px;font-weight:800;color:var(--gold);text-align:center}
  ol.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ol.board li .sc{font-weight:800}
  ol.board li.me{outline:2px solid var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:13px;padding:4px 10px;border-radius:99px;background:#0f2e20;border:1px solid var(--line)}
  .chip.off{opacity:.45}
  .chip.done{border-color:var(--green);color:#c9f3d8}
  .bar{height:10px;border-radius:99px;background:#0c2218;overflow:hidden;margin-top:6px}
  .bar > div{height:100%;background:var(--gold);transition:width .3s}
  .answer-peek{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
  .brand{text-align:center;margin:6px 0 10px}
  .brand .co{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}
  .brand .ev{font-size:18px;font-weight:800}
  .brand .gm{font-size:13px;color:var(--muted)}
  .prog{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
  .mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  a{color:var(--gold)}
  .snow{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.25;
    background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);
    background-size:60px 60px,90px 90px;background-position:0 0,30px 45px}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="items.js"></script>
</head>
<body>
<div class="snow"></div>
<div id="app"></div>
<script>
"use strict";
// ---------- helpers ----------
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const LABEL = { ai: "AI 🤖", real: "Real 📷" };

const ITEMS = (Array.isArray(window.ITEMS) ? window.ITEMS : []).map(it => {
  if (!it || !it.file) return null;
  const a = String(it.answer || "").toLowerCase().trim();
  if (a !== "ai" && a !== "real") { console.warn("Item skipped (answer must be ai or real):", it); return null; }
  const type = it.type || (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(it.file) ? "video" : "image");
  return { src: it.file, type, answer: a, note: it.note ? String(it.note) : "" };
}).filter(Boolean);
const TOTAL = ITEMS.length;

function brand() {
  return h("div", { class: "brand" },
    h("div", { class: "co", text: "LED in Action" }),
    h("div", { class: "ev", text: "Christmas Dinner 🎄" }),
    h("div", { class: "gm", text: "Real or AI?" }));
}

// keep screen awake where supported
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("click", keepAwake);

// media slot that only changes when the item changes (so videos don't restart)
function makeMediaSlot() {
  const wrap = h("div", { class: "media-wrap" });
  let key = null, el = null;
  return {
    wrap,
    set(item, onReady) {
      const k = item ? item.src : null;
      if (k === key) { if (el && el.tagName === "VIDEO" && el.paused) el.play().catch(() => {}); return; }
      key = k; wrap.replaceChildren(); el = null;
      if (!item) return;
      let fired = false;
      const ready = () => { if (!fired) { fired = true; if (onReady) onReady(); } };
      if (item.type === "video") {
        el = h("video", { class: "media", src: item.src, playsinline: true, "webkit-playsinline": true, autoplay: true, loop: true, preload: "auto" });
        el.muted = true; el.playsInline = true;
        el.addEventListener("loadeddata", ready); el.addEventListener("error", ready);
        const btn = h("button", { class: "sound", text: "🔇 Tap for sound", onclick: () => {
          el.muted = !el.muted; btn.textContent = el.muted ? "🔇 Tap for sound" : "🔊 Sound on"; el.play().catch(() => {});
        }});
        wrap.append(el, btn);
        el.play().catch(() => {});
      } else {
        el = h("img", { class: "media", src: item.src, alt: "" });
        el.addEventListener("load", ready); el.addEventListener("error", ready);
        wrap.append(el);
        if (el.complete) ready();
      }
      setTimeout(ready, 8000); // never hold the timer forever on a slow load
    }
  };
}
const preloaded = {};
function preload(item) {
  if (!item || preloaded[item.src]) return;
  if (item.type === "image") { const i = new Image(); i.src = item.src; preloaded[item.src] = i; }
  else { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = item.src; try { v.load(); } catch (e) {} preloaded[item.src] = v; }
}

// leaderboard: rows = [{id,name,score,done}]
function boardList(rows, myId, limit) {
  if (!rows || !rows.length) return h("p", { class: "muted center", text: "No players yet." });
  const ranked = []; let lastScore = null, pos = 0;
  rows.forEach((r, i) => { if (r.score !== lastScore) { pos = i + 1; lastScore = r.score; } ranked.push({ ...r, pos }); });
  let show = ranked;
  if (limit && ranked.length > limit) {
    show = ranked.slice(0, limit);
    const me = ranked.find(r => r.id === myId);
    if (me && me.pos > limit && !show.includes(me)) show = show.concat([me]);
  }
  const ol = h("ol", { class: "board" });
  for (const r of show) {
    const medal = r.pos === 1 ? "🥇" : r.pos === 2 ? "🥈" : r.pos === 3 ? "🥉" : r.pos;
    const me = r.id === myId;
    ol.append(h("li", { class: me ? "me" : "" },
      h("span", { class: "pos", text: String(medal) }),
      h("span", { class: "nm", text: r.name + (me ? " (you)" : "") }),
      h("span", { class: "prog", text: r.done >= TOTAL ? "✓ done" : `${r.done}/${TOTAL}` }),
      h("span", { class: "sc", text: String(r.score) })));
  }
  return ol;
}

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
if (typeof Peer === "undefined") {
  app.append(brand(), h("div", { class: "card center" }, h("p", { class: "big", text: "Couldn't load the game" }),
    h("p", { class: "muted", text: "Check your internet connection and refresh the page." })));
} else if (params.has("host")) hostMode();
else if (params.get("join")) playerMode(params.get("join"));
else landing();

// ---------- landing ----------
function landing() {
  app.append(brand(),
    h("div", { class: "card center" },
      h("p", { class: "muted", text: "Players: scan the QR code on the host's phone to join." }),
      h("button", { onclick: () => { location.href = location.pathname + "?host"; }, text: "I'm the host — open the leaderboard" }),
      h("p", { class: "muted small", text: `${TOTAL} item${TOTAL === 1 ? "" : "s"} loaded.` })));
}

// ---------- HOST: QR code + live leaderboard ----------
function hostMode() {
  let G = store.get("rai_host2", null);
  if (!G || !G.hostId) G = { hostId: "rai-" + rid(8), players: {} };
  const save = () => store.set("rai_host2", G);
  save();
  const conns = new Map();
  const joinUrl = location.origin + location.pathname + "?join=" + encodeURIComponent(G.hostId);
  let status = "Connecting…", statusOk = false, peer = null, showQR = true;

  const head = h("div"), body = h("div");
  app.append(head, body);

  function startPeer() {
    peer = new Peer(G.hostId);
    peer.on("open", () => { status = "Live"; statusOk = true; render(); });
    peer.on("connection", conn => {
      conn.on("data", d => onData(conn, d));
      const ask = () => { if (conn.open && !conn.pid) { try { conn.send({ t: "who" }); } catch (e) {} } };
      conn.on("open", () => { ask(); setTimeout(ask, 1500); setTimeout(ask, 4000); });
      conn.on("close", () => { if (conn.pid && conns.get(conn.pid) === conn) { conns.delete(conn.pid); render(); } });
      conn.on("error", () => {});
    });
    peer.on("disconnected", () => {
      status = "Reconnecting…"; statusOk = false; render();
      setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e) {} }, 1500);
    });
    peer.on("error", err => {
      console.warn("peer error", err.type, err);
      if (err.type === "unavailable-id") {
        status = "Game ID busy (close other host tabs) — retrying…"; statusOk = false; render();
        try { peer.destroy(); } catch (e) {}
        setTimeout(startPeer, 4000);
      } else if (peer.destroyed) { status = "Connection lost — retrying…"; statusOk = false; render(); setTimeout(startPeer, 3000); }
    });
  }
  setInterval(() => { if (peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 5000);

  const num = (v, max) => { v = Math.round(Number(v) || 0); return Math.max(0, Math.min(max, v)); };
  function onData(conn, d) {
    if (!d || typeof d !== "object" || d.t !== "hello") return;
    const pid = String(d.pid || "").slice(0, 40);
    if (!pid) return;
    const name = String(d.name || "").trim().slice(0, 24) || "Player";
    const p = d.p || {};
    conn.pid = pid;
    const old = conns.get(pid);
    if (old && old !== conn) { try { old.close(); } catch (e) {} }
    conns.set(pid, conn);
    G.players[pid] = { name, score: num(p.score, 150 * TOTAL), done: num(p.done, TOTAL), correct: num(p.correct, TOTAL) };
    save(); broadcast(); render();
  }
  const rows = () => Object.entries(G.players).map(([id, p]) => ({ id, name: p.name, score: p.score, done: p.done }))
    .sort((a, b) => b.score - a.score || b.done - a.done || a.name.localeCompare(b.name));
  function broadcast() {
    const msg = { t: "board", rows: rows() };
    for (const c of conns.values()) if (c.open) { try { c.send(msg); } catch (e) {} }
  }
  function hardReset() {
    if (!confirm("Wipe the leaderboard and make a brand-new game (new QR code)? Everyone will need to scan again and start over.")) return;
    store.del("rai_host2"); location.reload();
  }
  function qrBlock() {
    const box = h("div", { class: "center" });
    if (typeof qrcode !== "undefined") {
      try { const q = qrcode(0, "M"); q.addData(joinUrl); q.make(); box.append(h("img", { class: "qr", src: q.createDataURL(8, 2), alt: "Join QR code" })); } catch (e) {}
    }
    box.append(h("div", { class: "url", text: joinUrl }));
    return box;
  }

  function render() {
    const R = rows();
    const finished = R.filter(r => r.done >= TOTAL).length;
    head.replaceChildren(brand(), h("div", { class: "center" },
      h("span", { class: "pill " + (statusOk ? "ok" : "warn"), text: `Host · ${status} · ${conns.size} online` })));
    body.replaceChildren();
    if (showQR) body.append(h("div", { class: "card center" },
      h("p", { class: "big", text: "Scan to play 🎅" }), qrBlock(),
      h("p", { class: "muted small", text: "Everyone plays at their own pace. Keep this phone awake (turn off auto-lock) so the leaderboard stays live." })));
    body.append(h("div", { class: "card" },
      h("div", { class: "mini-h" }, h("strong", { text: "Leaderboard" }),
        h("span", { class: "muted small", text: `${R.length} playing · ${finished} finished` })),
      boardList(R, null)));
    if (!TOTAL) body.append(h("div", { class: "card center" }, h("p", { text: "No items found. Add some to items.js." })));
    body.append(
      h("button", { class: "secondary", onclick: () => { showQR = !showQR; render(); }, text: showQR ? "Hide QR code (show leaderboard only)" : "Show QR code" }),
      h("div", { style: "height:10px" }),
      h("button", { class: "ghost", onclick: hardReset, text: "Reset everything (new game & QR)" }));
  }
  render();
  startPeer();
}

// ---------- PLAYER: self-paced ----------
function playerMode(hostId) {
  let pid = store.get("rai_pid", null);
  if (!pid) { pid = rid(10); store.set("rai_pid", pid); }
  let name = store.get("rai_name", "");
  const PK = "rai_prog_" + hostId;
  const P = store.get(PK, null) || { index: 0, answers: {}, shown: {} };
  const saveP = () => store.set(PK, P);
  let board = null, peer = null, conn = null, linkStatus = "", lastAttempt = 0, gotBoard = false;

  const head = h("div"), top = h("div");
  const media = makeMediaSlot();
  const bottom = h("div");
  app.append(head, top, media.wrap, bottom);

  const summary = () => {
    let score = 0, correct = 0, done = 0;
    for (const a of Object.values(P.answers)) { done++; score += a.gained || 0; if (a.correct) correct++; }
    return { score, correct, done };
  };
  function sendProgress() {
    if (conn && conn.open && name) { try { conn.send({ t: "hello", pid, name, p: summary() }); } catch (e) {} }
  }

  // --- connection to the host (only needed for the leaderboard) ---
  function startPeer() {
    if (peer && !peer.destroyed) return;
    peer = new Peer();
    peer.on("open", () => { lastAttempt = 0; openConn(); });
    peer.on("disconnected", () => { setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e) {} }, 1000); });
    peer.on("error", err => {
      if (err.type === "peer-unavailable") { linkStatus = "Leaderboard offline"; render(); }
      else console.warn("peer error", err.type, err);
    });
  }
  function openConn() {
    if (!peer || !peer.open) return;
    lastAttempt = Date.now();
    if (conn) { const old = conn; conn = null; try { old.close(); } catch (e) {} }
    const c = peer.connect(hostId, { reliable: true });
    conn = c;
    c.on("open", () => { if (c !== conn) return; gotBoard = false; sendProgress(); });
    c.on("data", d => {
      if (c !== conn || !d) return;
      if (d.t === "who") { sendProgress(); return; }
      if (d.t === "board" && Array.isArray(d.rows)) { gotBoard = true; linkStatus = ""; board = d.rows; render(); }
    });
    c.on("close", () => { if (c !== conn) return; gotBoard = false; linkStatus = "Reconnecting…"; lastAttempt = 0; render(); });
    c.on("error", () => {});
  }
  setInterval(() => {
    if (!name) return;
    if (!peer || peer.destroyed) { startPeer(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} return; }
    if (conn && conn.open && !gotBoard) sendProgress();
    if (peer.open && (!conn || !conn.open) && Date.now() - lastAttempt > 20000) openConn();
  }, 2500);

  // --- game actions ---
  function answer(v) {
    const i = P.index;
    if (i >= TOTAL || P.answers[i]) return;
    const it = ITEMS[i];
    const shownAt = P.shown[i] || Date.now();
    const correct = v === it.answer;
    const secs = Math.max(0, (Date.now() - shownAt) / 1000);
    const gained = correct ? 100 + Math.round(50 * Math.max(0, 1 - secs / 20)) : 0;
    P.answers[i] = { vote: v, correct, gained };
    saveP();
    if (navigator.vibrate) navigator.vibrate(correct ? 40 : [30, 60, 30]);
    sendProgress(); render();
  }
  function next() { if (P.index < TOTAL) { P.index++; saveP(); sendProgress(); render(); window.scrollTo(0, 0); } }
  function changeName() { name = ""; store.set("rai_name", ""); render(); }

  function nameForm() {
    const input = h("input", { placeholder: "Your name", maxlength: "24", autocomplete: "given-name", value: store.get("rai_last_name", "") });
    const go = e => {
      e.preventDefault();
      const v = input.value.trim().slice(0, 24);
      if (!v) { input.focus(); return; }
      name = v; store.set("rai_name", v); store.set("rai_last_name", v);
      keepAwake(); startPeer(); sendProgress(); render();
    };
    const f = h("form", { onsubmit: go },
      h("p", { class: "big", text: "Real or AI? 🤔" }),
      h("p", { class: "muted", text: `Look at ${TOTAL} pictures and videos and guess: real, or made by AI? Go at your own pace — quicker correct answers score more points.` }),
      input, h("button", { type: "submit", text: "Let's play" }));
    setTimeout(() => input.focus(), 50);
    return h("div", { class: "card" }, f);
  }
  function miniBoard() {
    const card = h("div", { class: "card" },
      h("div", { class: "mini-h" }, h("strong", { text: "Leaderboard" }),
        linkStatus || !gotBoard ? h("span", { class: "muted small", text: linkStatus || "Connecting…" }) : null));
    if (board) card.append(boardList(board, pid, 5));
    else card.append(h("p", { class: "muted small center", text: "The leaderboard will appear once you're connected. Keep playing — your score is saved." }));
    return card;
  }

  function render() {
    const s = summary();
    head.replaceChildren(brand(),
      name ? h("div", { class: "center" }, h("span", { class: "pill ok", text: `${name} · ${s.score} pts · ${Math.min(s.done, TOTAL)}/${TOTAL}` })) : null);
    top.replaceChildren(); bottom.replaceChildren();

    if (!name) { media.set(null); media.wrap.style.display = "none"; top.append(nameForm()); return; }

    // finished
    if (P.index >= TOTAL) {
      media.set(null); media.wrap.style.display = "none";
      top.append(h("div", { class: "card center" },
        h("p", { class: "huge", text: "🏁 All done!" }),
        h("p", { class: "big", text: `${s.score} points` }),
        h("p", { class: "muted", text: `You got ${s.correct} of ${TOTAL} right.` }),
        h("p", { class: "small muted", text: "The leaderboard updates live as everyone else finishes. Merry Christmas! 🎄" })));
      const card = h("div", { class: "card" }, h("div", { class: "mini-h" }, h("strong", { text: "Leaderboard" }),
        linkStatus || !gotBoard ? h("span", { class: "muted small", text: linkStatus || "Connecting…" }) : null));
      card.append(board ? boardList(board, pid) : h("p", { class: "muted small center", text: "Connecting to the leaderboard…" }));
      bottom.append(card, h("button", { class: "ghost", onclick: changeName, text: "Change name" }));
      return;
    }

    const i = P.index, it = ITEMS[i], a = P.answers[i];
    media.wrap.style.display = "";
    media.set(it, () => { if (!P.shown[i]) { P.shown[i] = Date.now(); saveP(); } });
    if (ITEMS[i + 1]) preload(ITEMS[i + 1]);
    top.append(h("div", { class: "center muted", text: `Item ${i + 1} of ${TOTAL} — real or AI?` }));

    if (!a) {
      bottom.append(h("div", { class: "row" },
        h("button", { class: "vote ai", onclick: () => answer("ai"), text: LABEL.ai }),
        h("button", { class: "vote real", onclick: () => answer("real"), text: LABEL.real })));
      bottom.append(h("p", { class: "center muted small", text: "Your first tap locks in your answer. Quicker = more points!" }));
    } else {
      bottom.append(h("div", { class: "result " + it.answer },
        h("div", { class: "small", text: "It was…" }), h("div", { class: "huge", text: LABEL[it.answer] }),
        it.note ? h("div", { text: it.note }) : null));
      bottom.append(h("div", { class: "card center" },
        h("p", { class: "big", text: a.correct ? `✅ Correct! +${a.gained}` : `❌ Not quite — you said ${LABEL[a.vote]}` })));
      bottom.append(h("button", { onclick: next, text: i + 1 < TOTAL ? "Next →" : "See final results 🏆" }));
      bottom.append(miniBoard());
    }
  }

  render();
  if (name) startPeer();
}
</script>
</body>
</html>
